name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Arrange project files
        run: |
          d=app/src/main/java/com/example/videodownloader
          mkdir -p "$d"
          [ -f MainActivity.kt ] && mv MainActivity.kt "$d/" || true
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || true
          [ -f app.gradle.kts ] && mv app.gradle.kts app/build.gradle.kts || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --stacktrace --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              echo "### Build failed. Key lines from the log:"
              echo '```'
              grep -E 'What went wrong|^e: |error:|Error|FAILURE|Could not|not found|No such file' build.log | cut -c1-220 | head -25
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 build.log
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Video Downloader build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
